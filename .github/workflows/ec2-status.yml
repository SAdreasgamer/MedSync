name: EC2 Instance Management

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform: status or reboot'
        required: true
        default: 'reboot'

jobs:
  manage-ec2:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Check and Manage EC2 Instance
        run: |
          set -e
          INSTANCE_ID="i-08242ab39aaf4b94f"
          echo "Found Instance ID: $INSTANCE_ID"
          
          echo "=== Instance Status Checks ==="
          aws ec2 describe-instance-status --instance-ids "$INSTANCE_ID" --output json || true

          if [ "${{ github.event.inputs.action }}" == "reboot" ]; then
            echo "Rebooting instance $INSTANCE_ID..."
            aws ec2 reboot-instances --instance-ids "$INSTANCE_ID"
            echo "Reboot command issued successfully!"
          fi
